<!doctype html>
<html lang="ja">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <title>Reprokit｜実際のCVEを、自分で試して理解する</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --bg: #eef2f4;
                --panel: #fff;
                --ink: #14262e;
                --sub: #5b6e77;
                --line: #d3dde2;
                --teal: #0e6b73;
                --teal-d: #0a4f55;
                --tealbg: #dcecee;
                --amber: #9a5b00;
                --amberbg: #fbeccc;
                --red: #a3322b;
                --redbg: #f8dedb;
                --green: #2a6b3a;
                --greenbg: #dcefdf;
                --code: #16282f;
                --codeink: #d6ecef;
                box-sizing: border-box;
                padding-top: env(safe-area-inset-top, 0px);
                padding-bottom: env(safe-area-inset-bottom, 0px);
            }
            :root[data-theme="dark"] {
                --bg: #0e1a1f;
                --panel: #16262d;
                --ink: #e3eef1;
                --sub: #93a8b0;
                --line: #2a3f48;
                --teal: #62c2cb;
                --teal-d: #8fd7de;
                --tealbg: #17363c;
                --amber: #f0b45a;
                --amberbg: #3a2c12;
                --red: #f0877f;
                --redbg: #3d1d1a;
                --green: #79c68c;
                --greenbg: #173223;
                --code: #0a1418;
                --codeink: #cfe6ea;
            }
            * {
                box-sizing: border-box;
            }
            html,
            body {
                height: 100%;
                margin: 0;
            }
            html {
                scroll-padding-top: env(safe-area-inset-top, 0px);
            }
            body {
                background: var(--bg);
                color: var(--ink);
                font:
                    15px/1.75 "Noto Sans JP",
                    system-ui,
                    sans-serif;
                overflow: hidden;
            }
            button,
            input,
            select,
            textarea {
                font: inherit;
                color: inherit;
            }
            button {
                cursor: pointer;
            }
            a {
                color: var(--teal-d);
            }
            :focus-visible {
                outline: 3px solid var(--teal);
                outline-offset: 2px;
            }
            .app {
                display: grid;
                grid-template-rows: 54px minmax(0, 1fr);
                height: 100%;
            }
            header {
                display: flex;
                align-items: center;
                gap: 14px;
                padding: 0 20px;
                background: var(--panel);
                border-bottom: 1px solid var(--line);
            }
            .logo {
                display: flex;
                flex: none;
                align-items: center;
                background: none;
                border: 0;
                padding: 0;
            }
            .logo img {
                display: block;
                width: 128px;
                height: auto;
            }
            .hd {
                margin-left: auto;
                display: flex;
                gap: 12px;
                align-items: center;
                font-size: 12.5px;
                color: var(--sub);
            }
            .pill {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                height: 32px;
                max-width: 100%;
                padding: 0 10px;
                margin: 0.25rem 0 0.25rem 0;
                border-radius: 99px;
                font-size: 12.5px;
                line-height: 1;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                background: var(--tealbg);
                color: var(--teal-d);
            }
            .pill.amber {
                background: var(--amberbg);
                color: var(--amber);
            }
            .pill.green {
                background: var(--greenbg);
                color: var(--green);
            }
            .pill.red {
                background: var(--redbg);
                color: var(--red);
            }
            .dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: currentColor;
            }
            .btn {
                border: 1px solid var(--line);
                background: var(--panel);
                border-radius: 7px;
                padding: 5px 15px;
                font-weight: 500;
                text-decoration: none;
                display: inline-block;
                color: var(--ink);
            }
            .btn.primary {
                background: var(--teal);
                border-color: var(--teal);
                color: #fff;
            }
            .btn.danger {
                border-color: var(--red);
                color: var(--red);
                background: var(--redbg);
            }
            .btn.sm {
                padding: 2px 10px;
                font-size: 12.5px;
                color: var(--sub);
            }
            .btn:disabled {
                opacity: 0.45;
                cursor: not-allowed;
            }
            /* list view */
            .list {
                display: grid;
                grid-template-columns: 260px minmax(0, 1fr);
                height: 100%;
                min-height: 0;
            }
            .cats {
                background: var(--panel);
                border-right: 1px solid var(--line);
                padding: 18px 14px;
                overflow: auto;
            }
            .cats h2 {
                font-size: 13px;
                color: var(--sub);
                font-weight: 500;
                margin: 0 6px 8px;
            }
            .cat {
                display: flex;
                justify-content: space-between;
                width: 100%;
                text-align: left;
                padding: 12px 14px;
                border: 1px solid var(--line);
                border-radius: 8px;
                background: none;
                margin-bottom: 10px;
            }
            .cat[aria-pressed="true"] {
                border-color: var(--teal);
                background: var(--tealbg);
            }
            .cat span:last-child {
                color: var(--sub);
                font-size: 13px;
            }
            .note2 {
                font-size: 12.5px;
                color: var(--sub);
                margin: 16px 6px 0;
                padding-top: 12px;
                border-top: 1px dashed var(--line);
            }
            .cards {
                padding: 26px 34px;
                overflow: auto;
            }
            .cards h1 {
                font-size: 22px;
                margin: 0 0 4px;
            }
            .cards .lead {
                color: var(--sub);
                margin: 0 0 20px;
            }
            .grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
                gap: 18px;
                max-width: 900px;
            }
            .lcard {
                display: grid;
                grid-template-columns: 1fr 78px;
                gap: 10px;
                align-items: center;
                text-align: left;
                width: 100%;
                background: var(--panel);
                border: 1px solid var(--line);
                border-radius: 10px;
                padding: 16px 18px;
                position: relative;
                border-top: 3px solid var(--teal);
            }
            .lcard:hover:not(:disabled) {
                border-color: var(--teal);
            }
            .lcard:disabled {
                opacity: 0.55;
                cursor: not-allowed;
                border-top-color: var(--line);
            }
            .lcard small {
                color: var(--sub);
                font-size: 12px;
            }
            .lcard b {
                display: block;
                font-size: 17px;
                line-height: 1.5;
                margin: 2px 0 8px;
            }
            .ring {
                width: 70px;
                height: 70px;
                border-radius: 50%;
                display: grid;
                place-items: center;
                text-align: center;
                font-weight: 700;
                line-height: 1.2;
            }
            .ring div {
                width: 56px;
                height: 56px;
                border-radius: 50%;
                background: var(--panel);
                display: grid;
                place-items: center;
                font-size: 15px;
            }
            .ring em {
                display: block;
                font-style: normal;
                font-size: 11px;
                color: var(--sub);
                font-weight: 400;
            }
            /* detail */
            .detail {
                overflow: auto;
                padding: 22px 40px 70px;
                height: 100%;
            }
            .in {
                max-width: 1080px;
                margin: 0 auto;
            }
            .back {
                background: none;
                border: 0;
                color: var(--sub);
                padding: 0;
                font-size: 13px;
                margin-bottom: 6px;
            }
            h1.t {
                font-size: 28px;
                line-height: 1.4;
                margin: 2px 0 0;
                padding-bottom: 4px;
                border-bottom: 2px solid var(--teal);
            }
            .tm {
                background: var(--panel);
                border: 1px solid var(--line);
                border-radius: 6px;
                padding: 14px 18px;
                margin: 18px 0 22px;
            }
            .tm .r1 {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
            }
            .tm .r1 b {
                font-size: 15px;
            }
            .tm .r2 {
                display: flex;
                gap: 16px;
                align-items: center;
                flex-wrap: wrap;
                border-top: 1px solid var(--line);
                margin-top: 12px;
                padding-top: 12px;
                font-size: 13.5px;
            }
            .tm .sep {
                width: 1px;
                height: 18px;
                background: var(--line);
            }
            .st {
                font:
                    600 12px "IBM Plex Mono",
                    monospace;
                padding: 2px 10px;
                border-radius: 3px;
                background: var(--bg);
                color: var(--sub);
            }
            .st.run {
                background: var(--greenbg);
                color: var(--green);
            }
            .st.dep {
                background: var(--amberbg);
                color: var(--amber);
            }
            .st.stp {
                background: var(--redbg);
                color: var(--red);
            }
            .seg {
                display: flex;
                gap: 3px;
            }
            .seg i {
                width: 15px;
                height: 15px;
                transform: skewX(-20deg);
                background: var(--bg);
                border: 1px solid var(--line);
            }
            .seg i.on {
                background: var(--teal);
                border-color: var(--teal);
            }
            .mono {
                font-family: "IBM Plex Mono", monospace;
                font-size: 13px;
            }
            .pro {
                display: flex;
                align-items: baseline;
                gap: 10px;
                margin: 0 0 8px;
            }
            .pro h2 {
                margin: 0;
                font-size: 20px;
            }
            .pro span {
                color: var(--sub);
                font-size: 13px;
            }
            .prb {
                background: var(--panel);
                border: 1px solid var(--line);
                border-radius: 6px;
                padding: 14px 20px;
                margin-bottom: 26px;
                font-size: 14.5px;
            }
            .prb p {
                margin: 6px 0;
            }
            .facts {
                display: flex;
                gap: 26px;
                flex-wrap: wrap;
                margin: 6px 0 4px;
                font-size: 13.5px;
            }
            .facts span {
                display: block;
                color: var(--sub);
                font-size: 12px;
            }
            .tabs {
                display: flex;
                border: 1px solid var(--line);
                border-radius: 10px;
                background: var(--panel);
                overflow: hidden;
                margin-bottom: 16px;
            }
            .tab {
                flex: 1;
                display: flex;
                gap: 10px;
                align-items: center;
                padding: 10px 14px;
                border: 0;
                border-right: 1px solid var(--line);
                background: none;
                text-align: left;
            }
            .tab:last-child {
                border-right: 0;
            }
            .tab i {
                flex: none;
                width: 26px;
                height: 26px;
                border-radius: 50%;
                border: 2px solid var(--line);
                display: grid;
                place-items: center;
                font-style: normal;
                font-size: 12px;
                font-weight: 700;
            }
            .tab b {
                display: block;
                font-size: 13.5px;
                line-height: 1.4;
            }
            .tab small {
                color: var(--sub);
                font-size: 11.5px;
                line-height: 1.3;
                display: block;
            }
            .tab[aria-current="step"] {
                background: var(--tealbg);
            }
            .tab[aria-current="step"] i {
                border-color: var(--teal);
                color: var(--teal-d);
            }
            .tab.done i {
                background: var(--teal);
                border-color: var(--teal);
                color: #fff;
            }
            h2.ph {
                font-size: 20px;
                margin: 0 0 2px;
            }
            .lead2 {
                color: var(--sub);
                max-width: 46em;
                margin: 0 0 14px;
            }
            .stage {
                display: grid;
                grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
                gap: 18px;
                align-items: start;
            }
            .card {
                background: var(--panel);
                border: 1px solid var(--line);
                border-radius: 10px;
                padding: 16px 18px;
            }
            .card h3 {
                font-size: 14px;
                margin: 0 0 8px;
                color: var(--teal-d);
            }
            .log {
                background: var(--code);
                color: var(--codeink);
                border-radius: 8px;
                padding: 10px 14px;
                font:
                    12.5px/1.8 "IBM Plex Mono",
                    monospace;
                min-height: 100px;
                overflow-x: auto;
                white-space: pre;
            }
            .log .u {
                color: #ff9d94;
            }
            .log .t {
                color: #f6c26b;
            }
            .log .ok {
                color: #8fd9a0;
            }
            .step {
                margin: 0;
                padding: 0;
                list-style: none;
                counter-reset: s;
            }
            .step li {
                counter-increment: s;
                padding: 6px 0 6px 30px;
                position: relative;
                font-size: 14px;
            }
            .step li::before {
                content: counter(s);
                position: absolute;
                left: 0;
                top: 7px;
                width: 21px;
                height: 21px;
                border-radius: 50%;
                background: var(--tealbg);
                color: var(--teal-d);
                font-size: 12px;
                font-weight: 700;
                display: grid;
                place-items: center;
            }
            .note {
                background: var(--amberbg);
                border-radius: 8px;
                padding: 9px 13px;
                font-size: 13px;
                margin-top: 10px;
            }
            .reveal {
                margin-top: 10px;
                padding: 10px 14px;
                background: var(--tealbg);
                border-radius: 0 8px 8px 0;
                font-size: 14px;
            }
            .reveal.ng {
                border-color: var(--amber);
                background: var(--amberbg);
            }
            .data {
                width: 100%;
                border-collapse: collapse;
                font-size: 13px;
            }
            .data td,
            .data th {
                border-bottom: 1px solid var(--line);
                padding: 4px 6px;
                text-align: left;
            }
            .tl {
                display: flex;
                flex-direction: column;
            }
            .nd {
                display: grid;
                grid-template-columns: 30px 1fr auto;
                gap: 10px;
                padding: 9px 6px;
                border-radius: 8px;
                text-align: left;
                background: none;
                border: 0;
                width: 100%;
                opacity: 0.4;
                align-items: center;
            }
            .nd.vis {
                opacity: 1;
            }
            .nd i {
                width: 26px;
                height: 26px;
                border-radius: 50%;
                border: 2px solid var(--line);
                display: grid;
                place-items: center;
                font-style: normal;
                font-size: 12px;
                font-weight: 700;
                background: var(--panel);
            }
            .nd.at {
                background: var(--tealbg);
            }
            .nd.at i {
                border-color: var(--teal);
            }
            .nd.pick i {
                background: var(--red);
                border-color: var(--red);
                color: #fff;
            }
            .nd small {
                display: block;
                color: var(--sub);
                font-size: 12.5px;
                line-height: 1.5;
            }
            .diff {
                font:
                    12.5px/1.8 "IBM Plex Mono",
                    monospace;
                background: var(--code);
                color: var(--codeink);
                border-radius: 8px;
                padding: 10px 0;
                overflow-x: auto;
            }
            .diff div {
                padding: 0 14px;
                white-space: pre;
                cursor: pointer;
                border-left: 3px solid transparent;
            }
            .diff .del {
                background: #4a1f1f;
                color: #ffb3ab;
            }
            .diff .add {
                background: #173a26;
                color: #a5e6b6;
            }
            .diff .hl {
                border-left-color: #f6c26b;
                outline: 1px solid #f6c26b;
            }
            .cmp {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }
            .res {
                border: 1px solid var(--line);
                border-radius: 8px;
                padding: 10px 12px;
                font-size: 13.5px;
                min-height: 92px;
            }
            .res.bad {
                border-color: var(--red);
                background: var(--redbg);
            }
            .res.good {
                border-color: var(--green);
                background: var(--greenbg);
            }
            .act {
                display: flex;
                gap: 10px;
                flex-wrap: wrap;
                margin-top: 12px;
                align-items: center;
            }
            .nav {
                display: flex;
                justify-content: space-between;
                margin-top: 18px;
            }
            .sw {
                display: inline-flex;
                border: 1px solid var(--line);
                border-radius: 7px;
                overflow: hidden;
                margin-bottom: 10px;
            }
            .sw button {
                border: 0;
                background: none;
                padding: 3px 14px;
                font-size: 13px;
            }
            .sw button[aria-pressed="true"] {
                background: var(--teal);
                color: #fff;
            }
            textarea {
                width: 100%;
                border: 1px solid var(--line);
                border-radius: 8px;
                background: var(--bg);
                padding: 8px 10px;
                min-height: 70px;
            }
            .ov {
                position: fixed;
                inset: 0;
                background: rgba(10, 24, 30, 0.55);
                display: grid;
                place-items: center;
                z-index: 5;
            }
            .dlg {
                background: var(--panel);
                border-radius: 12px;
                padding: 22px 24px;
                width: min(460px, 92vw);
                border: 1px solid var(--line);
            }
            .dlg h3 {
                margin: 0 0 8px;
                font-size: 18px;
            }
            .toast {
                position: fixed;
                left: 50%;
                bottom: calc(18px + env(safe-area-inset-bottom, 0px));
                transform: translateX(-50%);
                background: var(--ink);
                color: var(--bg);
                padding: 7px 18px;
                border-radius: 8px;
                font-size: 13.5px;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.2s;
                z-index: 9;
            }
            .toast.on {
                opacity: 1;
            }
            .hide {
                display: none;
            }
            @media (max-width: 1000px) {
                body {
                    overflow: auto;
                }
                .app,
                .list {
                    display: block;
                    height: auto;
                }
                .stage,
                .cmp {
                    grid-template-columns: 1fr;
                }
                .tabs {
                    flex-wrap: wrap;
                }
                .detail,
                .cards {
                    padding: 18px;
                }
            }
            @media (prefers-reduced-motion: reduce) {
                * {
                    transition: none !important;
                }
            }
        </style>
    </head>
    <body>
        <div class="app">
            <header>
                <button class="logo" data-a="home" aria-label="Reprokit ホーム">
                    <img src="/assets/reprokit-logo.png" alt="Reprokit" /></button
                ><span style="color: var(--sub); font-size: 13.5px"
                    >実際のCVEを、自分で試して理解する</span
                >
                <div class="hd">
                    <button class="btn sm" id="theme">表示切替</button>
                </div>
            </header>
            <div id="view" style="min-height: 0; overflow: hidden"></div>
        </div>
        <div id="modal"></div>
        <div class="toast" id="toast" role="status"></div>

        <script>

            function labBox(l) {

            function p0(l) {

            function p1(l) {

            <div class="log" style="margin-top:10px">$ curl -sI http://127.0.0.1:${l.ports[0]}/ | head -n 1</div>

            function p2() {

            <div class="card"><h3>この地点の様子</h3><div class="log">${["受信直後の値: 外部入力（未検証）", "分岐: Hook Authentication", "保持: 値は加工されていない", "<span class='t'>展開: 値がコマンド引数へ</span>", "<span class='u'>実行: 展開後の文字列を解釈</span>", "<span class='t'>確定: すでにコマンドは実行済み</span>"][S.pos]}</div></div></div></div>`;

            function p3() {

                return `<div class="stage"><div class="card"><h3>修正差分（要約）2.63.5 → 2.63.6</h3>

            <div class="diff"><div class="del ${h === "a" ? "hl" : ""}" data-a="hl" data-v="a">- args := os.Expand(hookCommand, lookup(username, password))</div><div class="del ${h === "a" ? "hl" : ""}" data-a="hl" data-v="a">- cmd := exec.Command("sh", "-c", args)</div><div> </div><div class="add ${h === "b" ? "hl" : ""}" data-a="hl" data-v="b">+ cmd := exec.Command("sh", "-c", hookCommand)</div><div class="add ${h === "b" ? "hl" : ""}" data-a="hl" data-v="b">+ cmd.Env = append(cmd.Env, "USERNAME="+username, "PASSWORD="+password)</div></div>
            <p style="font-size:12.5px;color:var(--sub);margin:8px 0 0">学習用に簡略化した概念図です。実際の差分は<a href="https://github.com/filebrowser/filebrowser/security/advisories/GHSA-m93h-4hw7-5qcm" target="_blank" rel="noopener">公式アドバイザリ</a>で確認してください。</p></div>
            <div><div class="card"><h3>原因から修正まで</h3>
            <p style="margin:0 0 8px;font-size:14px"><b>あなたが見つけた原因（フェーズ3・手順4）</b><br><code>os.Expand</code>がユーザー名・パスワードをコマンド文字列の中へ展開し、その文字列を次の<code>sh -c</code>がシェルの命令として解釈します。入力値がデータではなくコマンドの一部になっていたことが問題です。</p>

            ${h === "a" ? `<div class="reveal">赤い行が原因に対応します。特に<code>os.Expand</code>の行で入力値をコマンド文字列へ混ぜ、次の<code>sh -c</code>の行でシェルに解釈させていました。</div>` : h === "b" ? `<div class="reveal">緑の行が修正に対応します。固定のコマンド本体と、環境変数で渡す入力値を分けています。</div>` : `<p style="color:var(--sub);font-size:13.5px;margin:8px 0 0">赤い行は「入力値をコマンドに混ぜた原因」、緑の行は「入力値をコマンドから分離する修正」です。</p>`}</div></div></div>`;
            }

            function p4(l) {
                const none = '<span style="color:var(--sub)">未実行</span>';
                return `<div class="card"><h3>同じ操作を、修正版（2.63.6・8081）で再実行</h3><p style="margin:0;font-size:14px">フェーズ2と同じ入力で、攻撃は防がれ、普通のログインは成功することを確かめます。</p>
            <div class="cmp" style="margin-top:12px"><div><b style="font-size:14px">脆弱版 2.63.5</b><div class="res ${S.runV ? "bad" : ""}" style="margin-top:6px">${S.runV ? `<span class="pill red">マーカーが作られた</span><br>入力が危険な実行経路に届きました。` : none}</div><div class="act"><button class="btn" data-a="runV" ${running() ? "" : "disabled"}>検証用入力を送る</button></div></div>
            <div><b style="font-size:14px">修正版 2.63.6</b><div class="res ${S.runF ? "good" : ""}" style="margin-top:6px">${S.runF ? `<span class="pill green">防がれた</span><br>マーカーは作られません。` : none}${S.normF ? `<hr style="border:0;border-top:1px solid var(--line)"><span class="pill green">通常利用は成功</span><br>demo-user は通常どおりログインできました。` : ""}</div><div class="act"><button class="btn primary" data-a="runF" ${running() ? "" : "disabled"}>同じ入力を送る</button><button class="btn" data-a="normF" ${running() ? "" : "disabled"}>通常のログインを試す</button></div></div></div>
            ${S.runF && S.normF ? `<div class="reveal"><b>確認できました。</b><br>防ぐべきものは防ぎ、必要な使い方は壊していません。最後にDESTROYでLabを片付けましょう。</div>` : ""}</div>
            <div class="card" style="margin-top:14px"><h3>実運用での対策</h3><p style="margin:0;font-size:14px">根本対策は<b>修正版へ更新</b>すること。更新できない間の緩和策は、フック認証でシェルを経由しない設定にし、管理画面を信頼できるネットワークに限定することです。</p></div>`;

            function renderDetail() {
                const l = L.find((x) => x.id === "fb"),
                    body = [p0, p1, p2, p3, p4][S.p](l);
                const lead = [
                    "まず、このプロダクトが本来どう動くかを確認します。",

                ][S.p];
                return `<div class="detail"><div class="in"><button class="back" data-a="home">← 教材一覧へ</button><h1 class="t">${l.title}</h1>
             <div class="facts" style="margin-top:8px"><div><span>CVE</span>${l.cve}</div><div><span>製品</span>${l.product}</div><div><span>Labの出どころ</span>${l.src}（${l.sha}）</div></div>

             <nav class="tabs" aria-label="学習の流れ">${PH.map((p, i) => `<button class="tab ${S.done[i] && i !== S.p ? "done" : ""}" data-a="go" data-i="${i}" ${i === S.p ? 'aria-current="step"' : ""}><i>${S.done[i] && i !== S.p ? "✓" : i + 1}</i><span><b>${p[0]}</b><small>${p[1]}</small></span></button>`).join("")}</nav>

             <div class="nav"><button class="btn" data-a="prev" ${S.p === 0 ? "disabled" : ""}>前へ</button><button class="btn primary" data-a="next">${S.p === 4 ? "完了する" : "次のフェーズへ"}</button></div></div></div>`;
            }

            function modal() {
                const m = $("#modal");
                if (S.modal === "deploy")
                    m.innerHTML = `<div class="ov"><div class="dlg" role="dialog" aria-modal="true"><h3>Labを起動しますか？</h3><p style="font-size:14px;margin:0 0 10px">固定コミットの取得と安全性の検査のあと、意図的に脆弱なソフトウェアを起動します。公開は127.0.0.1のみですが、Dockerは完全な隔離ではありません。重要な端末では専用VMを使ってください。</p><label style="display:flex;gap:8px;font-size:14px"><input type="checkbox" id="ok" ${S.ok ? "checked" : ""}>自分のPC内のLabにだけ試します</label><div class="act" style="justify-content:flex-end"><button class="btn" data-a="mc">やめる</button><button class="btn primary" data-a="go-deploy" ${S.ok ? "" : "disabled"}>起動する</button></div></div></div>`;

            function all() {

            function startDeploy() {
                S.lab = "deploying";

                    S.seg++;

                            "Labが起動しました。「別タブで開く」から画面を開けます",
                        );

                    all();
                }, 350);
                all();

            document.addEventListener("click", (e) => {
                const t = e.target.closest("[data-a]");

                const a = t.dataset.a,
                    v = t.dataset.v,
                    keep = $(".detail")?.scrollTop;

                    S.view = "list";
                } else if (a === "open") {
                    S.view = "detail";

                    S.cat = v;

                    S.p--;
                } else if (a === "lg") {
                    S.login = v;
                } else if (a === "hint") {
                    S.hint++;
                } else if (a === "repro") {
                    S.repro = true;
                } else if (a === "rst") {
                    S.repro = false;
                    S.hint = 0;
                } else if (a === "pick") {
                    if (+t.dataset.i <= S.pos) S.pick = +t.dataset.i;
                } else if (a === "back") {
                    S.pos = Math.max(0, S.pos - 1);
                    S.pick = S.pos;
                } else if (a === "fwd") {
                    S.pos = Math.min(5, S.pos + 1);

                    S.found = S.pick === 3;
                } else if (a === "hl") {
                    S.diffHl = v;
                } else if (a === "runV") {
                    S.runV = true;

                    S.runF = true;

                    S.modal = "destroy";
                } else if (a === "go-destroy") {
                    S.lab = "ready";
                    S.modal = null;
                    S.repro = S.runV = S.runF = S.normF = false;
                    toast(
                        "削除しました（Volume：" +
                            (S.vol === "keep" ? "保持" : "削除") +
                            "）",
                    );
                } else if (a === "copy") {
                    navigator.clipboard &&
                        navigator.clipboard.writeText(v).catch(() => {});
                    toast("コピーしました");
                    return;
                }
                all();
                const d = $(".detail");
                if (
                    d &&
                    keep &&
                    [
                        "lg",
                        "hint",
                        "repro",
                        "rst",
                        "pick",
                        "back",
                        "fwd",
                        "mark",
                        "hl",
                        "runV",
                        "runF",
                        "normF",
                        "reset",
                        "stop",
                    ].includes(a)
                )
                    d.scrollTop = keep;
                else if (d && ["go", "next", "prev"].includes(a))
                    d.scrollTop = 0;
            });
            document.addEventListener("change", (e) => {
                if (e.target.id === "ok") {
                    S.ok = e.target.checked;
                    modal();
                }
                if (e.target.id === "vol") S.vol = e.target.value;
            });
            document.addEventListener("input", (e) => {
                if (e.target.id === "nt") S.note = e.target.value;
            });
            document.addEventListener("keydown", (e) => {
                if (e.key === "Escape" && S.modal) {
                    S.modal = null;
                    modal();
                }
            });
            $("#theme").onclick = () => {
                const r = document.documentElement,
                    d = r.dataset.theme === "dark";
                r.dataset.theme = d ? "light" : "dark";
            };
            all();
        </script>
    </body>
</html>
