<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reprokit — 研修管理</title>
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/admin.css" />
    <script type="module" src="/src/admin.js"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/" aria-label="Reprokit 受講画面">
        <img class="brand-logo" src="/assets/reprokit-logo.png" alt="" />
      </a>
      <span class="product-label">TRAINING ADMINISTRATION</span>
      <a class="local-badge" href="/">受講画面へ</a>
    </header>
    <main class="admin-shell">
      <div id="admin-notice" class="notice" role="status" aria-live="polite"></div>
      <section id="login-panel" class="card admin-card">
        <p class="eyebrow">MANAGEMENT LOGIN</p>
        <h1>研修管理へログイン</h1>
        <form id="login-form">
          <label for="username">ユーザー名</label>
          <input id="username" name="username" autocomplete="username" required />
          <label for="password">パスワード</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
          <button class="primary" type="submit">ログイン</button>
        </form>
      </section>
      <section id="dashboard" hidden>
        <div class="admin-heading">
          <div><p class="eyebrow">TRAINING OVERVIEW</p><h1>研修管理</h1></div>
          <div class="actions"><button id="download">結果CSV</button><button id="logout">ログアウト</button></div>
        </div>
        <div class="admin-grid">
          <section class="card admin-card">
            <h2>コース</h2>
            <div id="courses"></div>
          </section>
          <section class="card admin-card">
            <h2>割り当てを作成</h2>
            <form id="assignment-form">
              <label for="course">保存済みコース</label><select id="course" required></select>
              <label for="learner">受講者ID</label><input id="learner" pattern="[a-z0-9][a-z0-9._-]{0,62}" required />
              <label for="due">期限</label><input id="due" type="datetime-local" required />
              <label><input id="retry" type="checkbox" checked /> 再提出を許可</label>
              <button class="primary" type="submit">割り当てる</button>
            </form>
          </section>
        </div>
        <section class="card admin-card">
          <h2>割り当て・受講状況</h2>
          <div class="table-scroll"><table><thead><tr><th>受講者</th><th>コース</th><th>状態</th><th>期限</th><th>提出</th></tr></thead><tbody id="assignments"></tbody></table></div>
        </section>
        <section class="card admin-card">
          <h2>提出回答</h2>
          <p id="submission-help" class="muted">割り当ての「提出を見る」を選んでください。</p>
          <div id="submissions"></div>
        </section>
      </section>
    </main>
  </body>
</html>
